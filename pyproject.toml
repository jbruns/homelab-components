[project]
name = "homelab-components"
version = "0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
pythonpath = ["."]
markers = [
    "contract: runs against a real upstream container started from upstreams.yaml (needs Docker)",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = [".", "components/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
