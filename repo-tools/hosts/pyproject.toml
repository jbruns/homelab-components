[project]
name = "homelab-hosts"
version = "0"
description = "Loads and validates a consuming repo's hosts.yaml (v1) for shared Repo Tooling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
license = "MIT"

[project.scripts]
homelab-hosts = "homelab_hosts.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_hosts"]

[tool.pytest.ini_options]
addopts = "--strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
