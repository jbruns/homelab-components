services:
  vaultwarden:
    image: vaultwarden/server:1.34.3
    container_name: vaultwarden
    depends_on: {mariadb: {condition: service_healthy}}
    labels: {tier: critical}
  mariadb:
    image: mariadb:11.8.3
    container_name: vaultwarden-mariadb
    labels: {tier: critical}
  mariadb-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: vaultwarden-mariadb-exporter
    depends_on: {mariadb: {condition: service_healthy}}
    labels: {tier: info}
