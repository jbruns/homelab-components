services:
  web:
    extends:
      file: ../../_baseline.yaml
      service: baseline
    image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
    command: ["--name", "${WHOAMI_NAME}"]
    healthcheck:
      test: ["CMD", "/whoami", "--help"]
    deploy:
      resources:
        limits:
          memory: 32M
    labels:
      tier: info
      startup-order: "3"
