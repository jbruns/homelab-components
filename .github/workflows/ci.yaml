name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: ruff, Repo Tooling tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - run: python -m pytest tools

  # This repo runs the reusable workflows it ships (.github/workflows/repo-*.yaml) on itself: actionlint covers every
  # workflow, including theirs, and the validator covers renovate.json and every preset under renovate/.
  lint:
    uses: ./.github/workflows/repo-lint.yaml
    with:
      renovate-configs: renovate.json renovate/repo-default.json

  gitleaks:
    uses: ./.github/workflows/repo-gitleaks.yaml

  plan:
    name: changed Components
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.affected.outputs.components }}
      repo-tools: ${{ steps.repo-tools.outputs.repo-tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: affected
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pull requests test the Components they touch; pushes to main and manual runs test every Component.
          components=$(python -m tools.components affected ${BASE:+--base "$BASE"})
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "Components: $components" >> "$GITHUB_STEP_SUMMARY"
      - id: repo-tools
        run: |
          # Every shared Repo Tooling package is tested on every run; they are small and consumers pin them.
          tools=$(python -m tools.components repo-tools)
          echo "repo-tools=$tools" >> "$GITHUB_OUTPUT"
          echo "Repo Tooling: $tools" >> "$GITHUB_STEP_SUMMARY"

  component:
    name: ${{ matrix.component }}
    needs: plan
    if: needs.plan.outputs.components != '[]'
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
    uses: ./.github/workflows/test-component.yaml
    with:
      component: ${{ matrix.component }}

  repo-tool:
    name: repo-tools/${{ matrix.tool }}
    needs: plan
    if: needs.plan.outputs.repo-tools != '[]'
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.repo-tools) }}
    uses: ./.github/workflows/test-repo-tool.yaml
    with:
      tool: ${{ matrix.tool }}

  # The tool-backed reusable workflows against a consuming repo in miniature, once the tool exists here.
  repo-validate:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.repo-tools), 'validate')
    uses: ./.github/workflows/repo-validate.yaml
    with:
      working-directory: .github/repo-ci-fixture

  repo-declared-containers:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.repo-tools), 'declared-containers')
    uses: ./.github/workflows/repo-declared-containers.yaml
    with:
      working-directory: .github/repo-ci-fixture

  # Single required check for branch protection.
  ci:
    name: ci
    if: always()
    needs: [tooling, lint, gitleaks, plan, component, repo-tool, repo-validate, repo-declared-containers]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all checks passed"
