name: repo gitleaks

# Reusable: scans the calling repo's git history for secrets with a pinned gitleaks release. A pull request scans
# its own commits, a push the pushed commits, and anything else (or full-history: true) the whole history. The
# repo's .gitleaks.toml and .gitleaksignore apply when present. Findings are redacted in the log.
on:
  workflow_call:
    inputs:
      full-history:
        description: scan every commit, whatever the event (do this once when a repo adopts the workflow)
        type: boolean
        default: false
      gitleaks-version:
        description: gitleaks release tag
        type: string
        # renovate: datasource=github-releases depName=gitleaks/gitleaks
        default: v8.30.1

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          version=${VERSION#v}
          base="https://github.com/gitleaks/gitleaks/releases/download/v$version"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${version}_checksums.txt"
          sha256sum --check --ignore-missing --strict "gitleaks_${version}_checksums.txt"
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: scan
        env:
          FULL: ${{ inputs.full-history }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          range=
          if [ "$FULL" != true ]; then
            if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
              range="$PR_BASE..$PR_HEAD"
            # A new branch has an all-zero "before"; a force push may leave it unreachable. Both scan everything.
            elif [ "$EVENT" = push ] && [ -n "${PUSH_BEFORE//0/}" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              range="$PUSH_BEFORE..$PUSH_AFTER"
            fi
          fi
          echo "scanning ${range:-every commit}"
          gitleaks git --no-banner --redact --verbose --exit-code 1 ${range:+--log-opts="$range"} .
