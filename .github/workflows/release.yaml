name: release

# Push a tag <component>-vX.Y.Z to release that Component: its checks run first, then
# ghcr.io/jbruns/<component>:X.Y.Z is built for amd64 and arm64 and pushed with provenance and an SBOM.
on:
  push:
    tags:
      - "*-v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  tag:
    name: parse tag
    runs-on: ubuntu-24.04
    outputs:
      component: ${{ steps.tag.outputs.component }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # the distroless base image's Python
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --quiet --requirement requirements-dev.txt
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: python -m tools.components release "$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: tag
    uses: ./.github/workflows/test-component.yaml
    with:
      component: ${{ needs.tag.outputs.component }}

  publish:
    name: publish ghcr.io/${{ github.repository_owner }}/${{ needs.tag.outputs.component }}:${{ needs.tag.outputs.version }}
    needs: [tag, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: components/${{ needs.tag.outputs.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ needs.tag.outputs.component }}:${{ needs.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/components/${{ needs.tag.outputs.component }}
            org.opencontainers.image.version=${{ needs.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
