name: release

# Push a tag <component>-vX.Y.Z on a commit in main to release that Component. Its checks run first. A Component
# with a Dockerfile is pushed as ghcr.io/<owner>/<component>:X.Y.Z (amd64 and arm64, with provenance and an SBOM);
# one without (e.g. a Host shell script) attaches the files directly under its src/ to the GitHub Release.
on:
  push:
    tags:
      - "*-v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  tag:
    name: parse tag
    runs-on: ubuntu-24.04
    outputs:
      component: ${{ steps.tag.outputs.component }}
      version: ${{ steps.tag.outputs.version }}
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not on main; release only commits that passed review"; exit 1
          fi
          python -m tools.components release "$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: tag
    uses: ./.github/workflows/test-component.yaml
    with:
      component: ${{ needs.tag.outputs.component }}

  image:
    name: push image
    needs: [tag, test]
    if: needs.tag.outputs.image == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ghcr.io/${{ github.repository_owner }}/${{ needs.tag.outputs.component }}:${{ needs.tag.outputs.version }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: components/${{ needs.tag.outputs.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ needs.tag.outputs.component }}:${{ needs.tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}/components/${{ needs.tag.outputs.component }}
            org.opencontainers.image.version=${{ needs.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  github-release:
    name: GitHub Release
    needs: [tag, test, image]
    if: always() && needs.test.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMPONENT: ${{ needs.tag.outputs.component }}
          IMAGE: ${{ needs.image.outputs.reference }}
        run: |
          assets=()
          if [ -n "$IMAGE" ]; then
            notes="Image: \`$IMAGE\`."
          else
            mapfile -t assets < <(find "components/$COMPONENT/src" -maxdepth 1 -type f | sort)
            notes="Assets: the files under \`components/$COMPONENT/src\`."
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag \
            --notes "$notes See components/$COMPONENT/README.md." "${assets[@]}"
